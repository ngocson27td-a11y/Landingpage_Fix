<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WebRTC Teaching Demo</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:20px;
}

.tabs{
display:flex;
margin-bottom:20px;
}

.tab{
padding:10px 20px;
background:#ccc;
cursor:pointer;
margin-right:5px;
border-radius:5px;
}

.tab.active{
background:#007BFF;
color:white;
}

.panel{
display:none;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.panel.active{
display:block;
}

video{
width:300px;
border:1px solid #ccc;
margin:5px;
}

textarea{
width:100%;
height:80px;
margin-top:5px;
}

#chatBox{
border:1px solid #ccc;
height:150px;
overflow:auto;
padding:10px;
margin-top:10px;
background:#fafafa;
}

button{
margin:5px;
padding:6px 12px;
}

.videoRow{
display:flex;
gap:20px;
margin-bottom:10px;
}

.videoBox{
text-align:center;
}

video{
width:300px;
border:1px solid #ccc;
}

</style>
</head>

<body>

<h2>WebRTC Video + Chat Demo</h2>

<div class="tabs">
<div class="tab active" onclick="showTab('A')">Peer A</div>
<div class="tab" onclick="showTab('B')">Peer B</div>
</div>

<!-- PEER A -->

<div id="A" class="panel active">

<h3>Peer A</h3>

<div class="videoRow">

<div class="videoBox">
<b>Camera của bạn</b><br>
<video id="videoA_local" autoplay muted playsinline></video>
</div>

<div class="videoBox">
<b>Video Peer B</b><br>
<video id="videoA_remote" autoplay playsinline></video>
</div>

</div>

<br>

<button onclick="startCamera()">1 Bật Camera</button>
<button onclick="createOffer()">2 Tạo Offer</button>

<textarea id="offerBox"></textarea>

<textarea id="answerBox" placeholder="Paste Answer"></textarea>

<button onclick="setAnswer()">3 Kết nối</button>

</div>


<!-- PEER B -->

<div id="B" class="panel">

<h3>Peer B</h3>

<div class="videoRow">

<div class="videoBox">
<b>Camera của bạn</b><br>
<video id="videoB_local" autoplay muted playsinline></video>
</div>

<div class="videoBox">
<b>Video Peer A</b><br>
<video id="videoB_remote" autoplay playsinline></video>
</div>

</div>

<br>

<button onclick="startCamera()">Bật Camera</button>

<textarea id="remoteOffer"></textarea>

<button onclick="setRemoteOffer()">1 Nhập Offer</button>

<button onclick="createAnswer()">2 Tạo Answer</button>

<textarea id="generatedAnswer"></textarea>

</div>


<h3>Chat giữa 2 Peer</h3>

<div id="chatBox"></div>

<input id="chatInput" placeholder="Nhập tin nhắn">

<button onclick="sendMessage()">Gửi</button>



<script>

let stream

let pcA
let pcB

let chatChannel



function showTab(id){

document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"))
document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"))

document.getElementById(id).classList.add("active")
event.target.classList.add("active")

}



async function startCamera(){

if(stream) return

stream = await navigator.mediaDevices.getUserMedia({
video:true,
audio:true
})

document.getElementById("videoA_local").srcObject = stream
document.getElementById("videoB_local").srcObject = stream

}



async function createOffer(){

if(!stream) await startCamera()

pcA = new RTCPeerConnection()

stream.getTracks().forEach(track=>{
pcA.addTrack(track,stream)
})

chatChannel = pcA.createDataChannel("chat")
setupChat(chatChannel)

pcA.ontrack = e=>{
document.getElementById("videoA_remote").srcObject = e.streams[0]
}

pcA.onicecandidate = e=>{

if(!e.candidate){

document.getElementById("offerBox").value =
JSON.stringify(pcA.localDescription)

}

}

let offer = await pcA.createOffer()
await pcA.setLocalDescription(offer)

}



async function setRemoteOffer(){

if(!stream) await startCamera()

pcB = new RTCPeerConnection()

stream.getTracks().forEach(track=>{
pcB.addTrack(track,stream)
})

pcB.ontrack = e=>{
document.getElementById("videoB_remote").srcObject = e.streams[0]
}

pcB.ondatachannel = e=>{
setupChat(e.channel)
}

pcB.onicecandidate = e=>{

if(!e.candidate){

document.getElementById("generatedAnswer").value =
JSON.stringify(pcB.localDescription)

}

}

let offer = JSON.parse(document.getElementById("remoteOffer").value)

await pcB.setRemoteDescription(offer)

}



async function createAnswer(){

if(pcB.signalingState !== "have-remote-offer"){
alert("Chưa có Offer hợp lệ")
return
}

let answer = await pcB.createAnswer()

await pcB.setLocalDescription(answer)

}



async function setAnswer(){

let answer = JSON.parse(document.getElementById("answerBox").value)

await pcA.setRemoteDescription(answer)

}



function setupChat(channel){

chatChannel = channel

channel.onmessage = e=>{

let box = document.getElementById("chatBox")

box.innerHTML += `<div><b>Peer:</b> ${e.data}</div>`

box.scrollTop = box.scrollHeight

}

}



function sendMessage(){

let input = document.getElementById("chatInput")

let msg = input.value.trim()

if(!msg) return

if(chatChannel && chatChannel.readyState === "open"){

chatChannel.send(msg)

let box = document.getElementById("chatBox")

box.innerHTML += `<div style="color:green"><b>Bạn:</b> ${msg}</div>`

box.scrollTop = box.scrollHeight

}

input.value=""

}

</script>

</body>
</html>
